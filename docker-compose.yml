
name: autodealer-analytics

services:
  mongodb:
    image: mongo:7.0
    container_name: autodealer-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0
    container_name: autodealer-cassandra
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    restart: unless-stopped

volumes:
  mongodb_data:
  cassandra_data:
